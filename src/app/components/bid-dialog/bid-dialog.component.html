<div class="backdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="bid-title">
        <h2 id="bid-title">What would you like to bid on?</h2>

        <!-- greyed out, and can't be switched on, without the 7 of trump in hand -->
        <label class="toggle" [class.unavailable]="!canCallSeven">
            <span class="toggle-text">
                <span class="toggle-name">Call the {{sevenName}}</span>
                <span class="toggle-note">{{canCallSeven ? 'Win the last trick with it' : "You don't hold the " + sevenName}}</span>
                <span class="toggle-cost seven-cost">{{getSevenCost()}}</span>
            </span>
            <input type="checkbox" class="seven-toggle" [checked]="seven" [disabled]="!canCallSeven"
                   (change)="setSeven($any($event.target).checked)">
            <span class="switch"></span>
        </label>

        <label class="toggle">
            <span class="toggle-text">
                <span class="toggle-name">Call the 100</span>
                <span class="toggle-note">Score 100 points. Every 10 points beyond 100 doubles the winnings.</span>
                <span class="toggle-cost hundred-cost">{{getHundredCost()}}</span>
            </span>
            <input type="checkbox" class="hundred-toggle" [checked]="hundred" (change)="setHundred($any($event.target).checked)">
            <span class="switch"></span>
        </label>

        <button type="button" class="bid-button" (click)="submit()">Bid</button>
    </div>
</div>
