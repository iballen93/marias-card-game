<div *ngIf="pickingTrump" style="color: green; font-size: var(--message-large); background-color: white; display: inline-block; padding: var(--message-padding); border-radius: 0.625rem; font-weight: bold;">
    Player {{activePlayer}} must pick Trump
</div>
<div *ngIf="buryingCards" style="color: green; font-size: var(--message-large); background-color: white; display: inline-block; padding: var(--message-padding); border-radius: 0.625rem; font-weight: bold;">
    Player {{activePlayer}} must Bury 2 Cards
</div>

<div *ngIf="winMessage != ''" style="color: green; font-size: var(--message-small); background-color: white; display: inline-block; padding: var(--message-padding); border-radius: 0.625rem; font-weight: bold;">
    {{winMessage}}
</div>

<br>
<div *ngIf="pcExplanation" class="pc-explanation">
    {{pcExplanation}}
    <button *ngIf="showNext" type="button" class="next-button" (click)="next.emit()">Next ▸</button>
</div>
<br *ngIf="pcExplanation">
<div *ngIf="illegalMoveMessage" style="color: red; font-size: var(--message-illegal); background-color: white; display: inline-block; padding: var(--message-padding); border-radius: 0.625rem; font-weight: bold;">
    Illegal Move - {{illegalMoveMessage}}
</div>
