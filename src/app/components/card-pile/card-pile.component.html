<div style="display: flex; flex-direction: column; align-items: center; box-sizing: border-box; padding-top: var(--pile-gap); width: 100%; height: 100%;">
    <div style="display: flex; flex: 1 1 auto; justify-content: center; width: 100%; min-height: 0;"
         [style.align-items]="title ? 'flex-end' : 'center'">
        <div *ngFor="let card of cards; let i = index; let isLast = last"
             style="min-width: 0;"
             [style.flex]="getCardFlex(isLast)"
             [style.margin-left]="getCardMargin(i)"
             class="card-slot"
             [style.z-index]="i"
             [style.transform]="getCardLift(card)">
            <img [style.width]="cardWidth ? '100%' : FULL_CARD_WIDTH"
                 [src]="card.image"
                 [attr.data-card-key]="getCardKey(card)"
                 (click)="selectCard(card)">
        </div>
    </div>
    <div *ngIf="title && (cards || alwaysShowTitle)" style="text-align: center; color: white; font-weight: bold; margin-top: -5px; font-size: var(--pile-title-size);">
        {{ title }}
    </div>
</div>
