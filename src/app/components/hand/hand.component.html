<div class="seat" [class.seat-active]="isActive">
    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <app-card-pile
                [cards]="playerCards"
                (cardSelected)="forwardCardSelected($event)"
                style="height: var(--hand-pile-height); width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center;">
        </app-card-pile>

        <div style="display: flex; justify-content: space-between; width: 100%;">
            <app-card-pile
                    title="Bury Pile"
                    [alwaysShowTitle]="isCaller"
                    [cards]="buryCards"
                    [cardWidth]="getSideCardWidth()"
                    [cardOverlap]="getSideCardOverlap()"
                    (cardSelected)="forwardCardSelected($event)"
                    style="height: var(--side-pile-height); width: 33%; overflow: hidden; display: flex; align-items: center; justify-content: center;">
            </app-card-pile>

            <app-card-pile
                    [title]="getWinPileTitle()"
                    [alwaysShowTitle]="true"
                    [cards]="winCards"
                    [cardWidth]="getSideCardWidth()"
                    [cardOverlap]="WIN_PILE_OVERLAP"
                    (cardSelected)="forwardCardSelected($event)"
                    style="height: var(--side-pile-height); width: 33%; overflow: hidden; display: flex; align-items: center; justify-content: center;">
            </app-card-pile>

            <app-card-pile
                    title="Marriage"
                    [cards]="marriageCards"
                    [cardWidth]="getSideCardWidth()"
                    [cardOverlap]="getSideCardOverlap()"
                    (cardSelected)="forwardCardSelected($event)"
                    style="height: var(--side-pile-height); width: 33%; overflow: hidden; display: flex; align-items: center; justify-content: center;">
            </app-card-pile>
        </div>
    </div>

    <h2 style="font-size: var(--player-title-size); margin: var(--player-title-margin);">
        {{ playerTitle }}: {{ formatCurrency(playerMoney) | currency:'USD':'symbol':'1.2-2' }}
    </h2>
</div>
