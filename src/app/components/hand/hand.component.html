<div class="seat" [class.seat-active]="isActive">
    <!-- The outer columns share what the win pile leaves, so bury and marriage move out as it grows -->
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; column-gap: 4px; justify-items: center; width: 100%;"
         [style.--side-card]="getSideCardWidth()"
         [style.--bury-width]="getBuryPileWidth()"
         [style.--marriage-width]="getMarriagePileWidth()"
         [style.--win-peek]="getWinCardPeek()">
        <app-card-pile
                title="Bury Pile"
                [alwaysShowTitle]="isCaller"
                [cards]="buryCards"
                cardWidth="var(--side-card)"
                [cardOverlap]="getSideCardOverlap()"
                (cardSelected)="forwardCardSelected($event)"
                style="height: var(--side-pile-height); width: var(--bury-width); overflow: hidden; display: flex; align-items: center; justify-content: center;">
        </app-card-pile>

        <app-card-pile
                [title]="getWinPileTitle()"
                [alwaysShowTitle]="true"
                [cards]="winCards"
                cardWidth="var(--side-card)"
                [cardOverlap]="getWinCardOverlap()"
                [style.width]="getWinPileWidth()"
                (cardSelected)="forwardCardSelected($event)"
                style="height: var(--side-pile-height); overflow: hidden; display: flex; align-items: center; justify-content: center;">
        </app-card-pile>

        <app-card-pile
                title="Marriage"
                [cards]="marriageCards"
                cardWidth="var(--side-card)"
                [cardOverlap]="getSideCardOverlap()"
                (cardSelected)="forwardCardSelected($event)"
                style="height: var(--side-pile-height); width: var(--marriage-width); overflow: hidden; display: flex; align-items: center; justify-content: center;">
        </app-card-pile>
    </div>

    <app-card-pile
            [cards]="playerCards"
            [liftedCards]="liftedCards"
            (cardSelected)="forwardCardSelected($event)"
            style="height: var(--hand-pile-height); width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center;">
    </app-card-pile>

    <h2 style="font-size: var(--player-title-size); margin: var(--player-title-margin);">
        {{ playerTitle }}: {{ formatCurrency(playerMoney) | currency:'USD':'symbol':'1.2-2' }}
    </h2>
</div>
