<div>
    <table>
        <tr>
            <td class="seat-player2">
                <app-hand [playerTitle]="getPlayerTitle(2)"
                          [playerMoney]="playerToMoney.get('player2')"
                          [playerPoints]="player2RoundPoints"
                          [isCaller]="currentCaller === 2"
                          [isActive]="activePlayer === 2 && !canPlayAgain"
                          [playerCards]="allPiles.get('player2')"
                          [liftedCards]="getLiftedCards(2)"
                          [hideCards]="isHandHidden(2)"
                          [hideBury]="isBuryHidden(2)"
                          [hideWin]="isWinHidden()"
                          [marriageCards]="allPiles.get('player2Marriage')"
                          [buryCards]="allPiles.get('player2Bury')"
                          [winCards]="allPiles.get('player2Win')"
                          (cardSelected)="cardSelected($event)"></app-hand>
            </td>
            <td class="table-center">
                <app-game-values class="game-values" [trump]="trump" [bidMultiplier]="bidMultiplier"></app-game-values>

                <app-turn-info class="turn-status" [class.round-over]="canPlayAgain"
                               [winMessage]="winMessage"
                               [illegalMoveMessage]="illegalMoveMessage"
                               [trump]="trump"
                               [bidMultiplier]="bidMultiplier"
                               [activePlayer]="activePlayer"
                               [pickingTrump]="pickingTrump"
                               [buryingCards]="buryingCards"
                               [pcExplanation]="pcExplanation"
                               [showNext]="waitingForNext"
                               [canPlayAgain]="canPlayAgain"
                               (playAgain)="playAgain()"
                               (next)="next()"></app-turn-info>

                <app-card-pile class="trick-pile" [cards]="this.allPiles.get('game')" (cardSelected)="cardSelected($event)"></app-card-pile>

                <button *ngIf="canFastPlay()" class="fast-play-button" (click)="fastPlayToLastHand()">Fast Play to Last Hand</button>

            </td>
            <td class="seat-player3">
                <app-hand [playerTitle]="getPlayerTitle(3)"
                          [playerMoney]="playerToMoney.get('player3')"
                          [playerPoints]="player3RoundPoints"
                          [isCaller]="currentCaller === 3"
                          [isActive]="activePlayer === 3 && !canPlayAgain"
                          [playerCards]="allPiles.get('player3')"
                          [liftedCards]="getLiftedCards(3)"
                          [hideCards]="isHandHidden(3)"
                          [hideBury]="isBuryHidden(3)"
                          [hideWin]="isWinHidden()"
                          [marriageCards]="allPiles.get('player3Marriage')"
                          [buryCards]="allPiles.get('player3Bury')"
                          [winCards]="allPiles.get('player3Win')"
                          (cardSelected)="cardSelected($event)"></app-hand>
            </td>
        </tr>
        <tr>
            <td class="seat-empty">
            </td>
            <td class="seat-player1">
                <app-hand [playerTitle]="getPlayerTitle(1)"
                          [playerMoney]="playerToMoney.get('player1')"
                          [playerPoints]="player1RoundPoints"
                          [isCaller]="currentCaller === 1"
                          [isActive]="activePlayer === 1 && !canPlayAgain"
                          [playerCards]="allPiles.get('player1')"
                          [liftedCards]="getLiftedCards(1)"
                          [hideCards]="isHandHidden(1)"
                          [hideBury]="isBuryHidden(1)"
                          [hideWin]="isWinHidden()"
                          [marriageCards]="allPiles.get('player1Marriage')"
                          [buryCards]="allPiles.get('player1Bury')"
                          [winCards]="allPiles.get('player1Win')"
                          (cardSelected)="cardSelected($event)"></app-hand>
            </td>
            <td class="seat-empty">
            </td>
        </tr>
    </table>
</div>
