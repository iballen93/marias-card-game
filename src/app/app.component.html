<nav>
    <a routerLink="/how-to-play">How To Play</a>
    <div class="new-game">
        <button type="button" class="menu-toggle" aria-haspopup="true" [attr.aria-expanded]="isNewGameMenuOpen"
                (click)="toggleNewGameMenu()">New Game ▾</button>
        <div *ngIf="isNewGameMenuOpen" class="new-game-menu" role="menu">
            <a routerLink="/game/standard" role="menuitem" (click)="closeNewGameMenu()">Standard Game</a>
            <a routerLink="/game/learning-pc-slow" role="menuitem" (click)="closeNewGameMenu()">Learning Mode vs PC</a>
            <a routerLink="/game/learning-solo" role="menuitem" (click)="closeNewGameMenu()">Practice (play all 3 hands)</a>
        </div>
    </div>
    <a (click)="goToWikiPage()">Mariáš Wiki Page</a>
</nav>

<router-outlet></router-outlet>

<div class="rotate-notice">Please rotate your phone to play</div>
